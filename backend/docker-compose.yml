services:
  db:
    # Prebuilt with the schema baked in; `--build` rebuilds from ./Dockerfile.db.
    image: ghcr.io/ayan-choudhury-dev/glean-backend-db:latest
    build:
      context: .
      dockerfile: Dockerfile.db
    restart: unless-stopped
    environment:
      POSTGRES_USER: glean
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-glean}
      POSTGRES_DB: glean
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glean -d glean"]
      interval: 5s
      timeout: 5s
      retries: 10

  rest:
    image: postgrest/postgrest:v12.2.3
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://glean:${POSTGRES_PASSWORD:-glean}@db:5432/glean
      PGRST_DB_SCHEMAS: public
      # No JWT secret => anonymous access as this role (single-tenant, RLS off).
      PGRST_DB_ANON_ROLE: glean
      PGRST_SERVER_PORT: 3000

  proxy:
    # Prebuilt with the web dashboard + nginx config baked in.
    image: ghcr.io/ayan-choudhury-dev/glean-backend-web:latest
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    depends_on: [rest]
    ports:
      - "${PORT:-8000}:80"

volumes:
  db_data:
