services:
  pocketbase:
    image: ghcr.io/muchobien/pocketbase:0.23.12
    restart: unless-stopped
    ports:
      - "${PORT:-8090}:8090"
    volumes:
      - pb_data:/pb_data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pb_data:
