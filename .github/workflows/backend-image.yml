name: backend image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - id: owner
        run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push web
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile.web
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.name }}/glean-backend-web:latest

      - name: Build + push db
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile.db
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.name }}/glean-backend-db:latest
