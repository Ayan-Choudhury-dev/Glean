name: Android release

# Builds the APKs in CI so cutting a release does not pin the laptop.
#
#   git tag v1.0.10 && git push origin v1.0.10
#
# The tag must match expo.version in app.json, or the job fails before building.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (must match app.json)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Resolve version
        id: version
        run: |
          APP_VERSION=$(node -p "require('./app.json').expo.version")
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          else
            RELEASE_VERSION="$INPUT_VERSION"
          fi
          if [ "$APP_VERSION" != "$RELEASE_VERSION" ]; then
            echo "app.json has $APP_VERSION, release is $RELEASE_VERSION" >&2
            exit 1
          fi
          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"
        env:
          INPUT_VERSION: ${{ inputs.version }}

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build both ABIs
        run: |
          cd android
          ./gradlew clean assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Verify native libraries
        run: bash scripts/verify-apks.sh "${{ steps.version.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: glean-${{ steps.version.outputs.version }}-apks
          path: dist/release/*.apk
          retention-days: 30

      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/attach-release.sh "${{ steps.version.outputs.version }}"
