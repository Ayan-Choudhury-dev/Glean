AutoName: Glean
Summary: Track your pantry and shopping list, entirely on your device.
Description: |
  Glean is a local-first pantry tracker. Keep track of what is in your
  kitchen, know what is running low, and build a shopping list — all stored
  on your device with no account and no server.

  Features:
  * Pantry inventory with categories, locations, quantities and barcodes
  * Shopping list that updates your pantry when you restock
  * Recent activity history
  * Works fully offline

RepoType: git
Repo: https://github.com/Ayan-Choudhury-dev/Glean

# Build recipe.
#
# Expo / React Native apps need the JS bundle produced before Gradle runs, so
# `prebuild` is not used (android/ is committed and carries the bundle task) —
# the bundle step is `createBundleReleaseJsAndAssets`, which assembleRelease
# depends on. If the buildserver disagrees, `gradle: - assembleRelease` plus an
# explicit `npx expo export` is the fallback.
#
# nodejs is pinned because the lockfile is regenerated against 22; npm ci fails
# on older majors for some Expo packages.
Builds:
  - versionName: 1.0.18
    versionCode: 19
    commit: v1.0.18
    subdir: android/app
    sudo:
      - apt-get update
      - apt-get install -y openjdk-17-jdk-headless
    init: npm ci
    gradle:
      - yes
    ndk: r27c
    output: app/build/outputs/apk/release/app-release.apk
    srclibs:
      - nodejs@22

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 1.0.18
CurrentVersionCode: 19
