AutoName: Glean
Summary: Track your pantry and shopping list, entirely on your device.
Description: |
  Glean is a local-first pantry tracker. Keep track of what is in your
  kitchen, know what is running low, and build a shopping list — all stored
  on your device with no account and no server.

  Features:
  * Pantry inventory with categories, locations, quantities and barcodes
  * Shopping list that updates your pantry when you restock
  * Recent activity history
  * Works fully offline

RepoType: git
